# QuickStock SDK 配置示例
# 
# QuickStock SDK采用实时数据获取模式，所有数据直接从外部数据源获取，
# 不使用本地缓存或数据库持久化。
#
# 将此文件复制到 ~/.quickstock/config.yaml 以使用自定义配置

# ============================================================================
# 数据源配置
# ============================================================================
# Tushare API令牌（可选，如果使用Tushare数据源）
tushare_token: null

# 启用/禁用各数据源
enable_baostock: true      # Baostock数据源（免费，历史数据完整）
enable_eastmoney: true     # 东方财富数据源（实时数据）
enable_tonghuashun: true   # 同花顺数据源（概念板块数据）

# ============================================================================
# 网络配置
# ============================================================================
# 请求超时时间（秒）
request_timeout: 30

# 最大重试次数
max_retries: 3

# 重试延迟（秒）
retry_delay: 1.0

# 最大并发请求数
max_concurrent_requests: 10

# ============================================================================
# 连接池配置
# ============================================================================
# 连接池总大小
connection_pool_size: 100

# 每个主机的最大连接数
connection_pool_per_host: 30

# 连接保持时间（秒）
connection_keepalive_timeout: 30

# 是否启用连接清理
connection_cleanup_enabled: true

# ============================================================================
# 数据格式配置
# ============================================================================
# 日期格式
date_format: "%Y%m%d"

# 浮点数精度
float_precision: 4

# ============================================================================
# 内存优化配置
# ============================================================================
# 流式处理块大小
stream_chunk_size: 10000

# 内存限制（MB）
memory_limit_mb: 500.0

# 内存批处理大小
memory_batch_size: 50

# 是否启用激进内存优化
aggressive_memory_optimization: false

# ============================================================================
# 日志配置
# ============================================================================
# 日志级别: DEBUG, INFO, WARNING, ERROR, CRITICAL
log_level: "INFO"

# 日志文件路径（null表示不写入文件）
log_file: "~/.quickstock/quickstock.log"

# ============================================================================
# 股票代码转换配置
# ============================================================================
# 是否启用自动股票代码转换
enable_auto_code_conversion: true

# 是否启用严格代码验证
strict_code_validation: false

# 是否记录代码转换日志
log_code_conversions: false

# 代码转换超时时间（秒）
code_conversion_timeout: 1.0

# 是否启用代码格式自动推断
enable_code_format_inference: true

# 是否启用交易所自动推断
enable_exchange_inference: true

# 批量转换的批次大小
code_conversion_batch_size: 1000

# 错误处理策略: strict（严格）, lenient（宽松）, ignore（忽略）
code_conversion_error_strategy: "strict"

# ============================================================================
# 财务报告配置
# ============================================================================
# 是否启用财务报告功能
financial_reports_enabled: true

# 批处理最大股票数量
financial_reports_batch_size: 50

# 请求超时时间（秒）
financial_reports_timeout: 30

# 最大重试次数
financial_reports_retry_attempts: 3

# 初始重试延迟（秒）
financial_reports_retry_delay: 1.0

# 每秒最大请求数（速率限制）
financial_reports_rate_limit: 2.0

# 请求队列大小
financial_reports_queue_size: 1000

# 是否启用性能指标收集
financial_reports_enable_metrics: true

# Baostock API端点
financial_reports_baostock_endpoint: "http://baostock.com"

# 是否需要认证
financial_reports_auth_required: false

# 认证令牌（如果需要）
financial_reports_auth_token: null

# ============================================================================
# 数据源优先级配置
# ============================================================================
# 为不同数据类型配置数据源优先级
# SDK将按顺序尝试这些数据源，直到成功获取数据
data_source_priority:
  # 股票基础信息
  stock_basic:
    - baostock
    - tushare
  
  # 股票日线数据（Baostock优先，避免东方财富封IP）
  stock_daily:
    - baostock
    - tushare
    - eastmoney
  
  # 股票分钟数据
  stock_minute:
    - eastmoney
    - tonghuashun
  
  # 指数基础信息
  index_basic:
    - tushare
    - baostock
  
  # 指数日线数据
  index_daily:
    - tushare
    - baostock
  
  # 基金基础信息
  fund_basic:
    - tushare
  
  # 基金净值数据
  fund_nav:
    - tushare
  
  # 交易日历
  trade_cal:
    - baostock
    - tushare
  
  # 概念板块
  concept:
    - tonghuashun
  
  # 财务报告
  financial_reports:
    - baostock
  
  # 业绩预告
  earnings_forecast:
    - baostock
  
  # 业绩快报
  flash_reports:
    - baostock
