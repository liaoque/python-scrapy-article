[tool:pytest]
# pytest配置文件 - 支持重新组织的测试结构

# 测试发现 - 支持新的目录结构
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 输出配置
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    --durations=10
    --maxfail=5

# 标记定义 - 按测试类型和组件分类
markers =
    # 测试类型标记
    unit: 单元测试 - 测试单个组件或函数
    integration: 集成测试 - 测试组件间交互
    performance: 性能测试 - 测试性能和基准
    e2e: 端到端测试 - 完整工作流测试
    
    # 测试特性标记
    slow: 慢速测试 - 执行时间超过1秒的测试
    network: 需要网络连接的测试
    async: 异步测试
    benchmark: 基准测试
    
    # 组件标记
    provider: 数据提供者测试
    client: 客户端测试
    core: 核心组件测试
    services: 服务层测试
    utils: 工具类测试
    models: 模型测试
    
    # 数据源标记
    baostock: 宝股通数据源测试
    eastmoney: 东方财富数据源测试
    tonghuashun: 同花顺数据源测试
    
    # 功能标记
    financial_reports: 财务报告功能测试
    limit_up_stats: 涨停统计功能测试
    price_distribution: 价格分布功能测试
    code_conversion: 代码转换功能测试

# 过滤警告
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:pandas.*
    ignore::FutureWarning:pandas.*
    ignore::RuntimeWarning:numpy.*
    ignore::UserWarning:matplotlib.*

# 异步测试配置
asyncio_mode = auto

# 最小版本要求
minversion = 6.0

# 测试超时（秒）
timeout = 300

# 测试收集配置
collect_ignore = setup.py

# 日志配置
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 并行测试配置（如果安装了pytest-xdist）
# addopts = -n auto

# 覆盖率配置（如果使用pytest-cov）
# addopts = --cov=quickstock --cov-report=html --cov-report=term-missing --cov-fail-under=80

# 测试数据配置
tmp_path_retention_count = 3
tmp_path_retention_policy = "failed"

# JUnit XML报告配置（用于CI/CD）
# addopts = --junitxml=test-results.xml

# 性能测试特殊配置
# 可以通过命令行选项运行特定类型的测试：
# pytest -m unit                    # 只运行单元测试
# pytest -m integration             # 只运行集成测试  
# pytest -m performance             # 只运行性能测试
# pytest -m "not slow"              # 跳过慢速测试
# pytest -m "unit and cache"        # 运行单元测试中的缓存测试
# pytest tests/unit/                # 运行unit目录下的所有测试
# pytest tests/integration/         # 运行integration目录下的所有测试
# pytest tests/performance/         # 运行performance目录下的所有测试